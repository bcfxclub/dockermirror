name: Build and Release

# 推送形如 2026.10.30 的 tag 时自动打包并发布 Release
on:
  push:
    tags:
      - '20*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build plugin (tgz + plg with md5)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python build_plugin.py
          echo "=== 产物 ==="
          ls -la dist/

      - name: Commit updated plg back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp dist/dockermirror.plg dockermirror.plg
          if ! git diff --quiet dockermirror.plg; then
            git add dockermirror.plg
            git commit -m "chore: update plg for ${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            dockermirror ${{ github.ref_name }}

            安装地址（raw）：
            `${{ github.server_url }}/${{ github.repository }}/raw/main/dockermirror.plg`
          files: |
            dist/*.tgz
